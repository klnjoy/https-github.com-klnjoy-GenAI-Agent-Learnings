name: Deploy MkDocs site to GitHub Pages

# Builds the MkDocs site from the committed docs/ folder and publishes it to
# GitHub Pages. The docs/ folder is generated locally by sync_docs.py and
# committed to the repo, so this workflow only needs mkdocs (no access to the
# local source folders is required).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs + Material
        run: pip install mkdocs mkdocs-material

      - name: Generate docs/ from content/
        # sync_docs.py regenerates docs/ from the committed content/. Without the
        # external GENAI_SOURCE_ROOT (not present in CI), it produces the public
        # site only — no local-only course materials.
        run: python sync_docs.py

      - name: Build site
        run: mkdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
