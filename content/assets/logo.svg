<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="OfferReady">
  <title>OfferReady</title>
  <!--
    Header mark: bold bullseye + arrow, tuned to read clearly at ~24px on the
    coloured header bar. White on transparent so it sits on the purple header.
  -->
  <!-- outer ring -->
  <circle cx="22" cy="26" r="15" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- inner ring -->
  <circle cx="22" cy="26" r="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- solid bullseye -->
  <circle cx="22" cy="26" r="3.5" fill="#ffffff"/>
  <!-- arrow shaft from centre to top-right, drawn OVER the rings -->
  <path d="M22 26 L41 7" fill="none" stroke="#ffffff" stroke-width="4.5"
        stroke-linecap="round"/>
  <!-- arrow head -->
  <path d="M32 6 L43 5 L42 16" fill="none" stroke="#ffffff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
